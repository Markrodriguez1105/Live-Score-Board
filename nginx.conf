events {
    worker_connections 1024;
}

http {
    upstream server_backend {
        server server:3001;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        # Admin app
        location /admin {
            proxy_pass http://admin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Viewer app
        location /view {
            proxy_pass http://view:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Tabulator app
        location /tabulator {
            proxy_pass http://tabulator:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Judge app
        location /judge {
            proxy_pass http://judge:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API
        location /api/ {
            proxy_pass http://server_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Socket.IO
        location /socket.io/ {
            proxy_pass http://server_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Uploaded files
        location /uploads/ {
            proxy_pass http://server_backend/uploads/;
            proxy_set_header Host $host;
        }

        # Default redirect to admin
        location = / {
            return 302 /admin/;
        }
    }
}
